{% extends 'autos_app/base.html' %}

{% block content %}
<div class="container">
    <h1 class="mb-4">Eliminar Cliente</h1>
    <p>¿Estás seguro de que quieres eliminar el cliente "{{ client }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'client_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
